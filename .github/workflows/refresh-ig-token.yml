name: Instagramトークン自動更新

on:
  schedule:
    # 毎週月曜 午前3時(UTC) = 日本時間の正午ごろ
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: トークン更新エンドポイントを呼び出す
        run: |
          curl -sS --fail-with-body --max-time 180 --retry 2 --retry-all-errors \
            "https://ig-tool-i9ya.onrender.com/api/internal/refresh-token?secret=${{ secrets.REFRESH_SECRET }}"
