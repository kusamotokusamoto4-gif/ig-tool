<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クサモト物件投稿</title>
<style>
  :root {
    --ink: #1f2a24;
    --paper: #f6f4ee;
    --line: #d9d4c6;
    --accent: #35603f;
    --accent-soft: #e4ede4;
    --danger: #a3402f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: #6b7568;
    font-size: 13px;
  }
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 32px 80px;
  }
  .lookup {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .lookup input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: white;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    cursor: pointer;
    background: var(--accent);
    color: white;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    background: white;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  section.panel {
    display: none;
  }
  section.panel.visible { display: block; }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .title-row h2 { font-size: 17px; margin: 0; }
  .count-badge {
    font-size: 13px;
    color: #6b7568;
  }
  .hint {
    font-size: 13px;
    color: #6b7568;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .thumb {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    aspect-ratio: 1;
    background: #eee;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb.selected {
    border-color: var(--accent);
  }
  .thumb .badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: bold;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb:not(.selected) .badge { display: none; }
  .thumb:not(.selected)::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.35);
  }
  .thumb .padded-tag {
    position: absolute;
    top: 6px;
    right: 6px;
    background: #b5892b;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .thumb .padding-guide {
    position: absolute;
    border: 1.5px dashed #b5892b;
    pointer-events: none;
  }
  label.field-label {
    display: block;
    font-size: 13px;
    color: #6b7568;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 180px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    background: white;
    margin-bottom: 20px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #log {
    margin-top: 20px;
    background: #10231a;
    color: #cdeccc;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 13px;
    padding: 16px;
    border-radius: 6px;
    white-space: pre-wrap;
    display: none;
    max-height: 260px;
    overflow-y: auto;
  }
  #log.visible { display: block; }
  .error {
    color: var(--danger);
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }
  .error.visible { display: block; }
  .success-banner {
    display: none;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 16px;
    font-size: 14px;
  }
  .success-banner.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>クサモト物件投稿</h1>
  <p>物件番号を入力して、掲載する画像とキャプションを選んでから投稿します。</p>
</header>

<main>
  <div class="lookup">
    <input type="text" id="propertyId" placeholder="物件番号（例：2-0135）" />
    <button id="loadBtn">読み込む</button>
  </div>
  <div class="error" id="loadError"></div>

  <section class="panel" id="panel">
    <div class="title-row">
      <h2 id="propTitle"></h2>
      <span class="count-badge" id="countBadge"></span>
    </div>
    <p class="hint">掲載したい画像をクリックして選んでください（2〜10枚、クリックした順番でカルーセルに並びます）。オレンジ色の点線がついた画像は、Instagramの比率に合わせて自動で白い余白を足したものです。点線の内側が元の写真の範囲なので、余白によって写真がずれて見えないか確認してください。</p>

    <div class="grid" id="grid"></div>

    <label class="field-label">キャプション</label>
    <textarea id="caption"></textarea>

    <div class="actions">
      <button id="publishBtn">この内容で投稿する</button>
      <button class="secondary" id="resetBtn">選択をやり直す</button>
    </div>

    <div class="error" id="publishError"></div>
    <div class="success-banner" id="successBanner"></div>
    <div id="log"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
